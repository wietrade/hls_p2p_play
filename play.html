<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <title>ArtPlayer + P2P 静态版（HLS · mDNS 修复）</title>

    <!-- ============================================================
         mDNS 禁用补丁：把本地 ICE host 候选中的 .local（mDNS 混淆）
         替换为真实局域网 IP（地址栏 ?lanip=），解决老 WebView/浏览器
         无法解析 mDNS 候选导致的 WebRTC 连接失败。
         必须在所有 WebRTC 相关脚本加载之前注入。
         ============================================================ -->
    <script>
      (function () {
        var LAN_IP = new URLSearchParams(location.search).get("lanip");
        if (LAN_IP && !/^\d{1,3}(\.\d{1,3}){3}$/.test(LAN_IP)) LAN_IP = null;
        var MDNS_RE = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.local/gi;
        var fixSdp = function (sdp) { return sdp ? (LAN_IP ? sdp.replace(MDNS_RE, LAN_IP) : sdp) : sdp; };
        var fixCandStr = function (c) { return c ? (LAN_IP ? c.replace(MDNS_RE, LAN_IP) : c) : c; };
        var OrigPC = window.RTCPeerConnection || window.webkitRTCPeerConnection;
        if (!OrigPC) return;
        // 诊断模式（?debug=1）：统计 ICE 候选类型（host/srflx/relay），定位 UC 等浏览器连不上 peer 的环节
        var DEBUG_ICE = new URLSearchParams(location.search).get("debug") === "1";
        var ICE_SUMMARY = { host: 0, srflx: 0, relay: 0, other: 0 };

        function WrappedPC(cfg) {
          // ICE 兜底注入：core 3.x 内部 rtcConfig 可能不生效时强制注入 __P2P_ICE（4.0.0 已修复，此为双保险）
          try {
            var ice = (typeof window.__P2P_ICE !== "undefined" && window.__P2P_ICE) || null;
            if (ice && ice.length && (!cfg || !cfg.iceServers || !cfg.iceServers.length)) {
              cfg = Object.assign({}, cfg || {}, { iceServers: ice });
            }
          } catch (e) {}
          var pc = new OrigPC(cfg);
          var origAddEventListener = pc.addEventListener.bind(pc);
          var origSetLocalDescription = pc.setLocalDescription.bind(pc);
          var origSetRemoteDescription = pc.setRemoteDescription.bind(pc);
          var origAddIceCandidate = pc.addIceCandidate.bind(pc);
          var userOnIce = null;
          var bound = false;

          var wrapEvent = function (fn) {
            return function (e) {
              if (DEBUG_ICE && e && e.candidate && e.candidate.candidate) {
                try {
                  var _m = (e.candidate.candidate.match(/ typ (\w+)/) || [])[1];
                  if (_m) { if (ICE_SUMMARY[_m] !== undefined) ICE_SUMMARY[_m]++; else ICE_SUMMARY.other++; }
                } catch (_e) {}
              }
              if (e && e.candidate && e.candidate.candidate) {
                try {
                  var fixed = fixCandStr(e.candidate.candidate);
                  var cand = new RTCIceCandidate({
                    candidate: fixed,
                    sdpMid: e.candidate.sdpMid,
                    sdpMLineIndex: e.candidate.sdpMLineIndex,
                  });
                  Object.defineProperty(e, "candidate", { value: cand, configurable: true });
                } catch (err) {}
              }
              return fn(e);
            };
          };

          pc.addEventListener = function (type, fn, opts) {
            if (type === "icecandidate") return origAddEventListener(type, wrapEvent(fn), opts);
            return origAddEventListener(type, fn, opts);
          };

          // 防御：部分浏览器（如 UC/老 WebView）对原生对象 defineProperty 支持不佳，失败时降级（不包装 onicecandidate）
          try {
            Object.defineProperty(pc, "onicecandidate", {
              get: function () { return userOnIce; },
              set: function (fn) {
                userOnIce = fn;
                if (fn && !bound) {
                  bound = true;
                  origAddEventListener("icecandidate", wrapEvent(function (e) {
                    if (userOnIce) return userOnIce(e);
                  }));
                }
              },
              configurable: true,
            });
          } catch (err) {}

          // 诊断模式：ICE 收集完成后汇总候选类型
          if (DEBUG_ICE) {
            try {
              origAddEventListener("icegatheringcomplete", function () {
                try { console.log("[p2p] ICE 汇总: " + JSON.stringify(ICE_SUMMARY)); } catch (_e) {}
              });
            } catch (_e) {}
          }

          pc.setLocalDescription = function (desc) {
            if (desc && desc.sdp) desc.sdp = fixSdp(desc.sdp);
            return origSetLocalDescription(desc);
          };
          // 入站候选保持原样：交给浏览器原生 mDNS 解析（Chrome 支持），
          // 避免把"对方 .local"错误地替换成本机 IP。
          pc.setRemoteDescription = function (desc) {
            return origSetRemoteDescription(desc);
          };
          pc.addIceCandidate = function (cand) {
            return origAddIceCandidate(cand);
          };
          return pc;
        }
        WrappedPC.prototype = OrigPC.prototype;
        window.RTCPeerConnection = WrappedPC;
        if (window.webkitRTCPeerConnection) {
          window.webkitRTCPeerConnection = WrappedPC;
        }
        console.log("[mdns-fix] 包装启用 LAN_IP=" + (LAN_IP || "(无，仅 ICE 注入)"));
      })();
    </script>

    <!-- Hls.js（全局，~1 最新版支持 iOS 17.1+ ManagedMediaSource） -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@~1/dist/hls.min.js"></script>

    <!-- P2P 全局版（UMD，core 已内联，一行 script 加载，无需 importmap；仅 HLS） -->
    <script src="./vendor/hlsjs.iife.min.js?v=400"></script>

    <!-- 可选：IndexedDB 持久分片缓存（点播命中率提升；?cache=0 关闭，?cacheLimit= 设容量 MiB） -->
    <script src="./vendor/indexeddb-storage.js?v=1"></script>

    <!-- ArtPlayer（UMD 全局 Artplayer） -->
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.min.js"></script>

    <!-- ArtPlayer HLS 控制插件（画质/音轨切换，读取 art.hls） -->
    <script src="https://cdn.jsdelivr.net/npm/artplayer-plugin-hls-control@1.1.0/dist/artplayer-plugin-hls-control.min.js"></script>

    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body { margin: 0; background: #0f1420; color: #dbe4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        font-size: 14px; }
      .container { width: 100%; }
      .player-wrap { position: relative; width: 100%; }
      #artplayer { width: 100%; aspect-ratio: 16 / 9; background: #000; }
      .stats-overlay { position: absolute; top: 10px; right: 10px; z-index: 10;
        display: grid; grid-template-columns: repeat(5, auto); gap: 6px; pointer-events: none; }
      .stats-overlay.stats-hidden { display: none; }
      .stats-overlay .stat { background: rgba(10, 15, 24, 0.72); border: 1px solid rgba(255,255,255,0.14);
        border-radius: 6px; padding: 4px 8px; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
      .stats-overlay .stat .l { font-size: 10px; color: #8fa3c7; }
      .stats-overlay .stat .v { font-size: 12px; font-weight: 600; margin-top: 2px; }
      .p2p .v { color: #2fd67a; } .up .v { color: #ffb84d; } .http .v { color: #4da3ff; } .peer .v { color: #4da3ff; }
      .err-box { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
        background: #0a0f18; color: #ff5c7a; font-size: 13px; text-align: center; padding: 20px; word-break: break-all; }
      .err-box[hidden] { display: none; }

      @media (max-width: 900px) {
        .stats-overlay { top: 6px; right: 6px; gap: 4px; }
        .stats-overlay .stat { padding: 3px 6px; }
        .stats-overlay .stat .v { font-size: 11px; }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <!-- 播放器 + 统计悬浮层（位于视频框内部右上角）；100% 宽度，便于 iframe 嵌入；纯静态，无需服务器 -->
      <div class="player-wrap">
        <div id="artplayer"></div>
        <div class="stats-overlay" id="statsOverlay">
          <div class="stat http"><div class="l">HTTP ↓</div><div class="v" id="sHttp">0 B</div></div>
          <div class="stat p2p"><div class="l">P2P ↓</div><div class="v" id="sP2P">0 B</div></div>
          <div class="stat up"><div class="l">上传 ↑</div><div class="v" id="sUp">0 B</div></div>
          <div class="stat p2p"><div class="l">占比</div><div class="v" id="sRatio">0%</div></div>
          <div class="stat peer"><div class="l">Peer</div><div class="v" id="sPeer">0</div></div>
        </div>
        <div class="err-box" id="errBox" hidden></div>
      </div>
    </main>

    <script>
      // ===== UMD 全局依赖 =====
      let HlsJsP2PEngine = null;
      try { HlsJsP2PEngine = window.p2pml && window.p2pml.hlsjs && window.p2pml.hlsjs.HlsJsP2PEngine; } catch (e) {}

      // ===== CDN 兜底：jsdelivr 失败时自动加载备选（unpkg / staticfile）=====
      const loadScript = (u) => new Promise((res) => {
        const s = document.createElement("script");
        s.src = u; s.onload = () => res(true); s.onerror = () => { s.remove(); res(false); };
        document.head.appendChild(s);
      });
      async function ensureLibs() {
        if (!window.Hls) {
          for (const u of ["https://unpkg.com/hls.js@1/dist/hls.min.js", "https://cdn.staticfile.org/hls.js/1.5.20/hls.min.js"]) {
            if (await loadScript(u)) break;
          }
        }
        if (!window.Artplayer) {
          for (const u of ["https://unpkg.com/artplayer/dist/artplayer.min.js", "https://cdn.staticfile.org/artplayer/5.1.0/artplayer.min.js"]) {
            if (await loadScript(u)) break;
          }
        }
        if (!window.artplayerPluginHlsControl) {
          await loadScript("https://unpkg.com/artplayer-plugin-hls-control@1.1.0/dist/artplayer-plugin-hls-control.min.js");
        }
      }

      // ===== 配置：客户端读取地址栏 URL 参数（纯静态，无需服务器） =====
      const qp = new URLSearchParams(location.search);

      // 默认配置
      const DEFAULT_STREAM   = "https://s3.bfllvip.com/video/yichengtangan/7191e1fa46c2/index.m3u8";
      // 默认 tracker：只用自建（公共 tracker 实测不稳定，2026-08-21 已全部移除）
      const DEFAULT_TRACKERS = [
        "wss://bot3.1230sb.com/tracker",    // 自建 wt-tracker（唯一，最可靠）
      ];
      const DEFAULT_STUN     = [
        "stun:stun.l.google.com:19302",
        "stun:stun1.l.google.com:19302",
        "stun:global.stun.twilio.com:3478",
        "stun:stun.qq.com:3478",
      ];

      // 按正则清洗逗号/空格分隔的列表
      const splitValid = (raw, re) => (raw || "").split(/[,，\s]+/).map((s) => s.trim()).filter((s) => s && re.test(s));

      // 流地址：?url= 传 http(s) 地址，非法或缺失时用默认（换源不刷页时动态更新）
      const rawUrl = qp.get("url") || "";
      let STREAM_URL = /^https?:\/\//i.test(rawUrl) ? rawUrl : DEFAULT_STREAM;

      // Tracker：默认 + ?tracker= 追加（不清空默认，防止用户输错导致无法连接；非法项自动丢弃）
      const TRACKERS = [...new Set([...DEFAULT_TRACKERS, ...splitValid(qp.get("tracker"), /^wss?:\/\//i)])];

      // STUN：默认 + ?stun= 追加（同上）
      const STUN_SERVERS = [...new Set([...DEFAULT_STUN, ...splitValid(qp.get("stun"), /^(stun|turn):/i)])];

      // TURN：?noturn=1 关闭中继兜底（默认开）
      const USE_TURN = qp.get("noturn") !== "1";

      // 局域网 IP（mDNS 修复）：?lanip= IPv4 格式
      const rawLanip = qp.get("lanip") || "";
      const LAN_IP = /^\d{1,3}(\.\d{1,3}){3}$/.test(rawLanip) ? rawLanip : null;

      // 统计悬浮层：默认显示，?stats=0 隐藏
      const SHOW_STATS = qp.get("stats") !== "0";
      // 持久缓存：默认开（IndexedDB，分片跨页面/换源复用）；?cache=0 关闭；?cacheLimit= 容量 MiB（默认 1024）
      const USE_PERSIST_CACHE = qp.get("cache") !== "0";
      const CACHE_LIMIT_MIB = (() => { const v = parseInt(qp.get("cacheLimit"), 10); return v > 0 ? v : 1024; })();
      // 播放行为：?autoplay=0 不自动播放 · ?muted=0 不静音 · ?controls=0 隐藏控制条
      const AUTOPLAY = qp.get("autoplay") !== "0";
      const MUTED = qp.get("muted") !== "0";
      const SHOW_CONTROLS = qp.get("controls") !== "0";

      // ===== 平台 / 设备标识 =====
      const isIOS = /iPad|iPhone|iPod/i.test(navigator.userAgent || "")
        || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const detectPlatform = () => {
        const ua = navigator.userAgent || "";
        if (/Android/i.test(ua)) return "And";
        if (isIOS) return "iOS";
        if (/Windows/i.test(ua)) return "Win";
        if (/Macintosh|Mac OS X/i.test(ua)) return "Mac";
        if (/Linux/i.test(ua)) return "Lin";
        return "Web";
      };
      const PEER_PREFIX = "W-" + detectPlatform(); // peerId 前缀（≤20 字符，core 自动补齐）

      // ?swarmId= 固定分组（仅兼容旧用法；互通测试请勿传）
      const SWARM_ID = qp.get("swarmId");

      // ===== 统计状态 =====
      const $ = (id) => document.getElementById(id);
      const stats = { http: 0, p2p: 0, up: 0 };
      const peers = new Set();
      const fmt = (n) => n < 1024 ? n + " B" : (n / 1048576).toFixed(1) + " MB";
      function log(msg, cls = "") {
        // UI 日志已隐藏，改走控制台（保留调试信息）
        console.log(`[p2p] ${msg}`);
      }
      function render() {
        $("sHttp").textContent = fmt(stats.http);
        $("sP2P").textContent = fmt(stats.p2p);
        $("sUp").textContent = fmt(stats.up);
        const total = stats.http + stats.p2p;
        $("sRatio").textContent = total === 0 ? "0%" : (stats.p2p / total * 100).toFixed(1) + "%";
        $("sPeer").textContent = peers.size;
      }

      // ===== iframe 控制 API（方便其他网站调用）=====
      // 父页面 -> 播放器：{type:"p2p:play"|"p2p:pause"|"p2p:seek",time|"p2p:load",url|"p2p:mute",muted|"p2p:volume",value|"p2p:getState"}
      // 播放器 -> 父页面：p2p:ready / p2p:state / p2p:stats（每秒）/ p2p:error
      const post = (msg) => { try { window.parent.postMessage(msg, "*"); } catch (e) {} };
      function postState() {
        const v = art && art.video;
        if (!v) return;
        post({ type: "p2p:state", playing: !v.paused && !v.ended, currentTime: v.currentTime, duration: v.duration || 0, muted: v.muted, volume: v.volume, src: STREAM_URL });
      }
      function showError(msg) {
        log(`❌ ${msg}`, "err");
        const box = document.getElementById("errBox");
        if (box) { box.textContent = msg; box.hidden = false; }
        post({ type: "p2p:error", message: msg });
      }
      window.addEventListener("message", (e) => {
        if (e.source !== window.parent) return;   // 仅响应父页面
        const d = e.data || {}, cmd = d.type;
        if (typeof cmd !== "string" || !cmd.startsWith("p2p:")) return;
        const v = art && art.video;
        switch (cmd) {
          case "p2p:play": v && v.play(); break;
          case "p2p:pause": v && v.pause(); break;
          case "p2p:seek": if (v && typeof d.time === "number") v.currentTime = Math.max(0, d.time); break;
          case "p2p:load":
            // 换源不刷新页面：重建播放器（IndexedDB 缓存保留，peer 重新连接）
            if (d.url && /^https?:\/\//i.test(d.url)) switchStream(d.url);
            break;
          case "p2p:mute": if (v) v.muted = !!d.muted; break;
          case "p2p:volume": if (v && typeof d.value === "number") v.volume = Math.max(0, Math.min(1, d.value)); break;
          case "p2p:getState": postState(); break;
        }
      });
      setInterval(() => {
        const total = stats.http + stats.p2p;
        post({ type: "p2p:stats", http: stats.http, p2p: stats.p2p, up: stats.up, ratio: total ? +((stats.p2p / total * 100).toFixed(1)) : 0, peers: peers.size });
      }, 1000);

      // ===== P2P 引擎事件 =====
      let engine = null;
      function onEngine(e) {
        engine = e;
        // 显示当前 core 版本（确认加载的是 4.0.0：-PM0400-；3.0.1 缓存会显示 -PM0300-）
        try {
          const g = e.getConfig ? e.getConfig() : e.core.getConfig();
          const v = g.core ? g.core.trackerClientVersionPrefix : g.trackerClientVersionPrefix;
          log(`🧬 core ${v}`, "p2p");
        } catch (err) { log(`🧬 core 版本读取失败: ${err.message}`, "err"); }
        e.addEventListener("onPeerConnect", (p) => { peers.add(p.peerId); render(); log(`✔ Peer 连接: ${p.peerId}`, "p2p"); });
        e.addEventListener("onPeerClose", (p) => { peers.delete(p.peerId); render(); log(`✖ Peer 断开: ${p.peerId}`); });
        e.addEventListener("onChunkDownloaded", (b, src) => { if (src === "http") stats.http += b; else stats.p2p += b; render(); });
        e.addEventListener("onChunkUploaded", (b) => { stats.up += b; render(); });
        e.addEventListener("onSegmentLoaded", (d) => log(`◉ 分片完成 (${d.downloadSource}) ${fmt(d.bytesLength)} · peer=${d.peerId || "—"}`, d.downloadSource === "p2p" ? "p2p" : ""));
        e.addEventListener("onTrackerError", (d) => log(`⚠ Tracker 错误: ${d.trackerUrl} ${d.error?.message || ""}`, "err"));
        e.addEventListener("onTrackerWarning", (d) => log(`⚠ Tracker 警告: ${d.trackerUrl} ${d.warning?.message || ""}`));
        e.addEventListener("onPeerConnectError", (d) => log(`⚠ Peer 连接失败: ${d.peerId} (${d.trackerUrl}) ${d.error?.message || ""}`, "err"));
        e.addEventListener("onPeerWarning", (d) => log(`⚠ Peer 警告: ${d.peerId} ${d.warning?.message || ""}`));
      }

      // ===== 自定义分片缓存（提升缓存命中率）=====
      // 内存版兜底（等价于官方默认 SegmentMemoryStorage 的简化实现，?cache=0 或脚本缺失时用）
      function makeMemoryStorage() {
        const cache = new Map();
        let usage = 0, cb = null;
        const key = (sw, id) => sw + "|" + id;
        return {
          async initialize() {},
          onPlaybackUpdated() {},
          onSegmentRequested() {},
          async storeSegment(_sw, streamSwarmId, segmentId, data, startTime, endTime, streamType) {
            cache.set(key(streamSwarmId, segmentId), { data, segmentId, streamSwarmId, startTime, endTime, streamType });
            usage += data.byteLength;
            if (cb) cb(streamSwarmId);
          },
          async getSegmentData(_sw, streamSwarmId, segmentId) {
            const it = cache.get(key(streamSwarmId, segmentId));
            return it ? it.data : undefined;
          },
          getUsage() { return { totalCapacity: 4096, usedCapacity: usage / 1048576 }; },
          hasSegment(_sw, streamSwarmId, segmentId) { return cache.has(key(streamSwarmId, segmentId)); },
          getStoredSegmentIds(_sw, streamSwarmId) {
            const out = [];
            for (const v of cache.values()) if (v.streamSwarmId === streamSwarmId) out.push(v.segmentId);
            return out;
          },
          destroy() { cache.clear(); },
          setSegmentChangeCallback(fn) { cb = fn; },
        };
      }
      // 选择缓存实现：?cache=1（默认）IndexedDB 持久缓存；?cache=0 或脚本缺失 → 内存缓存
      function makeSegmentStorage() {
        const P = window.P2PML;
        if (USE_PERSIST_CACHE && P && P.createIndexedDbStorage) {
          return P.createIndexedDbStorage({ limitMiB: CACHE_LIMIT_MIB });
        }
        return makeMemoryStorage();
      }

      // ===== core 配置 =====
      function coreCfg() {
        // 公网 NAT 穿透：STUN 打洞 + 自建 TURN(3002) 中继兜底（对称 NAT 用；?noturn=1 关闭）
        const _ice = STUN_SERVERS.map((url) => ({ urls: url }));
        if (USE_TURN) {
          _ice.push({ urls: "turn:43.165.167.132:3002", username: "p2p", credential: "P2pTurn123" });
        }
        window.__P2P_ICE = _ice;
        return {
          // peerId 前缀：标识节点（网页端 W-平台 / APP 端 A+机型），便于 tracker/日志识别设备
          trackerClientVersionPrefix: PEER_PREFIX,
          // swarmId 留空 → 按流地址分组（由下方 streamSwarmIdBuilder 派生，与 APK 端算法一致）
          announceTrackers: TRACKERS,
          p2pNotReceivingBytesTimeoutMs: 30000,
          p2pErrorRetries: 10,
          // core 4.0.0: rtcConfig 为对象格式（3.x 需函数，4.x 已修复 iceServers 未传入的 bug）
          rtcConfig: { iceServers: window.__P2P_ICE },
          // 自定义分片缓存：IndexedDB 持久化（点播跨页/换源命中率提升）；factory 必须返回合法 SegmentStorage
          customSegmentStorageFactory: () => makeSegmentStorage(),
          ...(SWARM_ID ? { swarmId: SWARM_ID } : {}),
          // 按流派生 streamSwarmId（与 APK 端 index.html 算法逐字一致，单码率）：
          // 同一 m3u8 → 两端同 swarm 互通；不同 m3u8 → 各自 swarm 隔离
          streamSwarmIdBuilder: ({ swarmId, streamType }) => {
            const url = (swarmId || "")
              .split("?")[0].split("#")[0]
              .replace(/^https?:\/\//i, "").replace(/\/+$/, "")
              .toLowerCase();
            return `v2-${streamType}-${url}`;
          },
        };
      }
      const guard = (hls) => { const o = hls.recoverMediaError?.bind(hls); hls.recoverMediaError = () => { try { hls.startLoad(); } catch {} }; };

      // ===== 播放（customType.m3u8 → P2P HLS；iOS 兼容回退）=====
      let art = null;
      function playM3u8(video, url, artInstance) {
        if (HlsJsP2PEngine && window.Hls && window.Hls.isSupported()) {
          // P2P HLS：hls.js 支持 MSE / iOS 17.1+ ManagedMediaSource 均走此路径
          // 幂等保护：ArtPlayer 会周期性重复触发 customType，同一 URL 已接入则复用现有引擎，
          // 避免 Hls + P2P 引擎反复销毁重建导致 peer 抖动/断连
          if (artInstance.hls && artInstance.__hlsUrl === url) return;
          if (artInstance.hls) artInstance.hls.destroy();
          artInstance.__hlsUrl = url;
          const HlsWithP2P = HlsJsP2PEngine.injectMixin(window.Hls);
          const hls = new HlsWithP2P({
            p2p: { core: coreCfg(), onHlsJsCreated(h) { onEngine(h.p2pEngine); } },
            enableWorker: false, // iOS ManagedMediaSource 必须在主线程
          });
          guard(hls);
          hls.loadSource(url);
          hls.attachMedia(video);
          artInstance.hls = hls; // 官方约定属性
          artInstance.on("destroy", () => hls.destroy());
          // 刷新 hls-control 插件 UI（画质/音轨按钮）
          const refresh = () => {
            try { artInstance.plugins?.artplayerPluginHlsControl?.update?.(); } catch {}
          };
          hls.on(window.Hls.Events.MANIFEST_PARSED, refresh);
          hls.on(window.Hls.Events.LEVEL_SWITCHED, refresh);
          video.addEventListener("loadedmetadata", refresh);
          const poll = setInterval(() => {
            if (hls.levels && hls.levels.length) { refresh(); clearInterval(poll); }
          }, 600);
          setTimeout(() => clearInterval(poll), 30000);
          log(`▶ P2P HLS 已接入${isIOS ? "（iOS ManagedMediaSource）" : ""}`);
        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
          // iOS 老版本无 MSE：走原生 HLS（不经过 P2P，但可正常播放）
          video.src = url;
          log("🍎 当前环境 hls.js 不可用，已回退原生 HLS（无 P2P）", "err");
          try { artInstance.notice.show = "当前浏览器不支持 P2P（MSE 不可用），已用原生方式播放"; } catch (e) {}
        } else {
          artInstance.notice.show = "不支持的播放格式: m3u8";
        }
      }

      // ===== 换源（不刷新页面）：更新地址栏 + 重建播放器（缓存/引擎重建，分片缓存经 IndexedDB 保留） =====
      function setStreamUrl(url) {
        STREAM_URL = url;
        try {
          const u = new URL(location.href);
          u.searchParams.set("url", url);
          history.replaceState(null, "", u.toString());
        } catch (e) {}
      }
      function switchStream(url) {
        if (!/^https?:\/\//i.test(url)) return;
        log(`🔄 换源（不刷页）: ${url}`);
        setStreamUrl(url);
        load();
        post({ type: "p2p:ready", core: "p2p-media-loader", url: STREAM_URL });
      }

      // ===== 初始化播放器 =====
      function load() {
        try { art?.destroy(false); } catch {}
        art = null; engine = null; peers.clear();
        stats.http = 0; stats.p2p = 0; stats.up = 0; render();
        log(`🚀 初始化 ArtPlayer [${isIOS ? "iOS" : "Hls.js/HLS"}]: ${STREAM_URL}`);
        log(`  cache=${USE_PERSIST_CACHE ? `IndexedDB（持久, ${CACHE_LIMIT_MIB} MiB）` : "内存（?cache=0）"}`);
        log(`  tracker=${TRACKERS.join(",")}`);
        log(`  stun=${STUN_SERVERS.join(",")}`);
        if (USE_TURN) log(`  turn=turn:43.165.167.132:3002（中继兜底）`);
        if (LAN_IP) log(`  [mdns-fix] lanip=${LAN_IP}（本地 host 候选将用真实 IP）`, "p2p");
        if (SWARM_ID) log(`  [swarm] 固定分组 swarmId=${SWARM_ID}`);
        const opts = {
          container: "#artplayer",
          url: STREAM_URL,
          type: "m3u8",
          setting: true,          // ⚙ 设置面板
          playbackRate: true,     // 播放速度
          aspectRatio: true,      // 画面比例
          subtitleOffset: true,   // 字幕偏移
          playsInline: true,      // iOS 内联播放必需
          ...(SHOW_CONTROLS ? {} : { controls: [] }), // ?controls=0 隐藏控制条（ArtPlayer controls 为数组）
          customType: { m3u8: playM3u8 },
          autoplay: AUTOPLAY,     // ?autoplay=0 关闭
          muted: MUTED,           // ?muted=0 带声音（iOS 自动播放需静音）
          volume: 0.5,
        };
        const hlsControl = window.artplayerPluginHlsControl;
        if (hlsControl) {
          opts.plugins = [hlsControl({
            quality: { control: false, setting: true, title: "画质", auto: "自动", getName: (l) => l.height && l.height > 0 ? l.height + "P" : "默认" },
            audio: { control: false, setting: true, title: "音轨", auto: "自动", getName: (t) => t.name || t.id },
          })];
        }
        art = new Artplayer(opts);
        window.__art = art;
        // 统计悬浮层：默认显示，?stats=0 隐藏
        if (!SHOW_STATS) {
          const ov = document.getElementById("statsOverlay");
          if (ov) ov.classList.add("stats-hidden");
        }
      }

      // ===== WebRTC 支持检测（诊断 UC 等无法连 peer 的浏览器）=====
      function detectWebRTC() {
        const r = { pc: false, dc: false, error: "" };
        try {
          const PC = window.RTCPeerConnection || window.webkitRTCPeerConnection || window.mozRTCPeerConnection;
          r.pc = !!PC;
          if (PC) {
            try {
              const t = new PC({ iceServers: [] });
              r.dc = typeof t.createDataChannel === "function";
              t.close();
            } catch (e) { r.error = "实例化失败: " + e.message; }
          }
        } catch (e) { r.error = e.message; }
        return r;
      }
      (function () {
        const w = detectWebRTC();
        log(`🔌 WebRTC: RTCPeerConnection=${w.pc ? "✅" : "❌"} DataChannel=${w.dc ? "✅" : "❌"}${w.error ? "（" + w.error + "）" : ""}`);
        if (!w.pc || !w.dc) log("⚠ 当前浏览器不支持/受限 WebRTC，P2P 不可用（仅 HTTP 播放）", "err");
      })();

      // ===== 初始化（异步：先确保 CDN 库可用）=====
      log(`📌 HLS P2P Player 启动`);
      (async () => {
        await ensureLibs();
        if (!window.Artplayer) {
          showError("加载播放器失败：CDN 不可达（hls.js / ArtPlayer）");
          return;
        }
        if (!HlsJsP2PEngine) log("⚠ p2p 引擎不可用，将回退原生 HLS", "err");
        load();
        post({ type: "p2p:ready", core: "p2p-media-loader", url: STREAM_URL });
      })();
    </script>
  </body>
</html>
